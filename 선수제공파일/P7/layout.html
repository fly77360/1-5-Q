<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P7 카드 3개</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 30px; background: whitesmoke; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
.cards { width: 700px; }
.card { padding: 20px; background: white; border: 1px solid lightgray; }
.card h3 { margin: 0 0 10px; }
.card p { margin: 0 0 16px; color: gray; line-height: 1.5; }
.card button { padding: 8px 0; background: royalblue; color: white; border: none; }

/* ▼ 이 아래에 CSS를 작성하세요 */
</style>
</head>
<body>
  <div class="cards">
    <div class="card">
      <h3>Basic</h3>
      <p>글 3개</p>
      <button>선택</button>
    </div>
    <div class="card">
      <h3>Standard</h3>
      <p>글 30개, 사진 10장, 댓글 기능과 방문자 통계를 제공합니다.</p>
      <button>선택</button>
    </div>
    <div class="card">
      <h3>Premium</h3>
      <p>글 무제한</p>
      <button>선택</button>
    </div>
  </div>
</body>
</html>
