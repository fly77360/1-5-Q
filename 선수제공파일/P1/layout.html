<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1 공지 글자 정렬</title>
<style>
* {
   box-sizing: border-box; 
  }

body { 
  margin: 0; 
  padding: 30px;
   background: whitesmoke;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; 
  }

.notice { 
  width: 500px; 
  padding: 24px; 
  background: white; 
  border: 1px solid lightgray;
   line-height: 1.6; 
  }

.notice h2 {
  margin: 0 0 10px; 
}

.notice p { 
  margin: 8px 0; 
}

/* ▼ 이 아래에 CSS를 작성하세요 */

.notice h2 {
  text-align: center;
}

.date {
  text-align: right;
  color: gray;
}

.writer {
  text-align: right;
}

</style>
</head>
<body>
  <div class="notice">
    <h2>공지사항</h2>
    <p class="date">2026-11-05</p>
    <p>동아리 방은 오후 5시에 닫습니다.</p>
    <p>마지막으로 나가는 사람은 불을 꺼 주세요.</p>
    <p class="writer">작성자: 회장</p>
  </div>
</body>
</html>
