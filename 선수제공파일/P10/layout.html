<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P10 요금제 카드</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 30px; background: whitesmoke; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
#plans { width: 760px; }
.plan { width: 220px; padding: 20px; background: white; border: 1px solid lightgray; }
.plan h3 { margin: 0 0 10px; }
.plan ul { margin: 0 0 16px; padding: 0; list-style: none; }
.plan a { padding: 8px 24px; background: royalblue; color: white; text-decoration: none; }
#plans .plan li { color: gray; }

/* ▼ 이 아래에 CSS를 작성하세요 */
</style>
</head>
<body>
  <div id="plans">
    <div class="plan">
      <h3>Free</h3>
      <ul>
        <li>글 3개</li>
        <li>사진 1장</li>
      </ul>
      <a href="#">시작</a>
    </div>
    <div class="plan">
      <h3>Pro</h3>
      <ul>
        <li>글 30개</li>
        <li>사진 10장</li>
        <li>댓글</li>
        <li>통계</li>
        <li>광고 제거</li>
      </ul>
      <a href="#">시작</a>
    </div>
    <div class="plan">
      <h3>Max</h3>
      <ul>
        <li>글 무제한</li>
        <li>사진 무제한</li>
        <li>댓글</li>
      </ul>
      <a href="#">시작</a>
    </div>
  </div>
</body>
</html>
