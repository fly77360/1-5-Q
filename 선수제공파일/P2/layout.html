<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2 카드 가로 가운데</title>
<style>
* {
   box-sizing: border-box; 
  }

body {
   margin: 0; 
   padding: 30px;
    background: whitesmoke;
     font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; 
    }

#card {
   padding: 24px;
   background: white; 
   border: 2px solid skyblue; 
   border-radius: 8px; 
  }

#card h3 {
   margin: 0 0 12px;
   }

#card p { 
  margin: 6px 0; 
}


/* ▼ 이 아래에 CSS를 작성하세요 */

#card {
  width: 400px;
  margin: 0 auto;
  text-align: center;
}

.tag {
  color: red;
}

</style>
</head>
<body>
  <div id="card">
    <h3>오늘의 급식</h3>
    <p>김치볶음밥</p>
    <p>미역국</p>
    <p class="tag">알레르기 주의</p>
  </div>
</body>
</html>
