<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P9 페이지 레이아웃</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
header { height: 60px; padding: 0 30px; background: navy; color: white; }
.logo { font-size: 22px; font-weight: bold; }
header a { color: white; text-decoration: none; }
aside { width: 160px; padding: 16px; background: lightgray; }
aside ul { margin: 0; padding: 0; list-style: none; }
aside li { padding: 6px 0; }
main { padding: 24px; }
footer { padding: 16px; background: navy; color: white; }

/* ▼ 이 아래에 CSS를 작성하세요 */
</style>
</head>
<body>
  <header>
    <div class="logo">WebClub</div>
    <a href="#">로그인</a>
  </header>
  <div class="wrap">
    <aside>
      <ul>
        <li>시험 일정</li>
        <li>대회 안내</li>
        <li>수업 자료</li>
        <li>갤러리</li>
        <li>건의함</li>
      </ul>
    </aside>
    <main>
      <h2>공지사항</h2>
      <p>내용이 짧아도 푸터는 화면 맨 아래에 있어야 합니다.</p>
    </main>
  </div>
  <footer>© 2026 WebClub</footer>
</body>
</html>
